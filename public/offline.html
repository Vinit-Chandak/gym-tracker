<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <title>Offline · Overload</title>
    <style>
      body {
        margin: 0;
        background: #0e1013;
        color: #f3f5f7;
        font: 16px system-ui;
        display: grid;
        min-height: 100dvh;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      p {
        color: #9aa4b2;
        line-height: 1.6;
      }
      a {
        display: block;
        background: #f2b544;
        color: #1a1300;
        padding: 1rem;
        border-radius: 14px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>You’re offline</h1>
      <p>
        This page needs a connection. Reconnect and try again — any sets you typed but did not save
        stay on this device until you do.
      </p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
