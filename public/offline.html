<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141517" />
    <title>Offline · Overload</title>
    <!--
      Served from the cache with no network and no account, so this page carries its own
      copy of the sheet's two palettes rather than importing the app's theme, and sets its
      type in the system's sans: Barlow is not in the cache. It reads the same device-local
      appearance key so an explicit Light or Dark choice still holds here.
    -->
    <style>
      :root {
        color-scheme: light;
        --canvas: #fcfcfb;
        --grid: rgb(21 23 26 / 0.16);
        --ink: #15171a;
        --ink-muted: #585f66;
        --line: #dcdedd;
        --pen: #2f4bc8;
        --highlight: #ffd933;
        --highlight-strong: #f2c90f;
        --on-highlight: #15171a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-overload-mode="light"]) {
          color-scheme: dark;
          --canvas: #141517;
          --grid: rgb(241 242 243 / 0.1);
          --ink: #f1f2f3;
          --ink-muted: #aab0b7;
          --line: #2f3236;
          --pen: #9db2ff;
          --highlight: #ffe14d;
          --highlight-strong: #fff07a;
          --on-highlight: #15171a;
        }
      }
      :root[data-overload-mode="dark"] {
        color-scheme: dark;
        --canvas: #141517;
        --grid: rgb(241 242 243 / 0.1);
        --ink: #f1f2f3;
        --ink-muted: #aab0b7;
        --line: #2f3236;
        --pen: #9db2ff;
        --highlight: #ffe14d;
        --highlight-strong: #fff07a;
        --on-highlight: #15171a;
      }
      body {
        margin: 0;
        /* The sheet: the canvas with its faint construction grid, one dot every 20px. */
        background-color: var(--canvas);
        background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 1.5px);
        background-size: 20px 20px;
        color: var(--ink);
        font:
          16px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      main {
        box-sizing: border-box;
        width: min(100%, 24rem);
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      img {
        display: block;
        border-radius: 0.375rem;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.125rem;
        line-height: 1.3;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0 0;
        max-width: 20rem;
        color: var(--ink-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }
      /* The one highlighter on the page: black ink on yellow, the way back. */
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 100%;
        max-width: 20rem;
        min-height: 3rem;
        margin-top: 1.5rem;
        padding: 0.75rem 1rem;
        background: var(--highlight);
        color: var(--on-highlight);
        border: 1px solid var(--highlight-strong);
        border-radius: 0.25rem;
        text-decoration: none;
        font-weight: 500;
      }
      a:active {
        background: var(--highlight-strong);
      }
      a:focus-visible {
        outline: 2px solid var(--pen);
        outline-offset: 2px;
      }
    </style>
    <script>
      try {
        var m = localStorage.getItem("overload:appearance");
        if (m === "light" || m === "dark")
          document.documentElement.setAttribute("data-overload-mode", m);
      } catch (e) {
        /* No storage: the media query decides, which is the System default anyway. */
      }
    </script>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>You’re offline</h1>
      <p>
        This page needs a connection. Reconnect and try again. Your unsaved set and activity drafts
        stay on this device until you save them.
      </p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
